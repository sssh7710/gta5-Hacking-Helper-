limit_req_zone $binary_remote_addr zone=gta_reports:10m rate=2r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gta-reports.64-110-118-28.sslip.io;

    ssl_certificate /etc/letsencrypt/live/gta-reports.64-110-118-28.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gta-reports.64-110-118-28.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location = /health {
        proxy_pass http://127.0.0.1:8765/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /v1/reports {
        limit_req zone=gta_reports burst=3 nodelay;
        proxy_pass http://127.0.0.1:8765/v1/reports;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name gta-reports.64-110-118-28.sslip.io;
    return 301 https://$host$request_uri;
}
